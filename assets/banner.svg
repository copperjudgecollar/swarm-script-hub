<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="50%" stop-color="#131a2b"/>
      <stop offset="100%" stop-color="#1b1030"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b4a8a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow)"/>

  <!-- decorative swarm-like elements, low opacity, kept off text -->
  <g opacity="0.18" stroke="#8fa3ff" stroke-width="1" fill="none">
    <circle cx="150" cy="60" r="40"/>
    <circle cx="1080" cy="70" r="55"/>
    <circle cx="90" cy="300" r="30"/>
    <circle cx="1120" cy="290" r="45"/>
    <line x1="60" y1="40" x2="220" y2="90"/>
    <line x1="1000" y1="30" x2="1150" y2="110"/>
    <line x1="40" y1="320" x2="160" y2="270"/>
    <line x1="1050" y1="330" x2="1160" y2="260"/>
  </g>

  <g opacity="0.12" fill="#ffffff">
    <circle cx="200" cy="50" r="3"/>
    <circle cx="260" cy="80" r="2"/>
    <circle cx="960" cy="60" r="3"/>
    <circle cx="1030" cy="100" r="2"/>
    <circle cx="120" cy="280" r="2"/>
    <circle cx="1100" cy="310" r="3"/>
    <circle cx="80" cy="200" r="2"/>
    <circle cx="1140" cy="190" r="2"/>
  </g>

  <path d="M 0 250 Q 300 200 600 250 T 1200 250" stroke="#5b6ea8" stroke-width="1" fill="none" opacity="0.15"/>
  <path d="M 0 90 Q 300 130 600 90 T 1200 90" stroke="#5b6ea8" stroke-width="1" fill="none" opacity="0.15"/>

  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="60.0" fill="#ffffff" font-weight="600">
    <tspan x="600" dy="0">Final Swarm Script</tspan>
  </text>

  <text x="600" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Final Swarm Script runner for automation devs stuck editing</tspan>
    <tspan x="600" dy="28">configs blind — pipeline, hot reload, preview, on…</tspan>
  </text>
</svg>